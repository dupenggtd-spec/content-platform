            <div class="field"><label>状态</label><select class="select" name="status">${[['pending','待评估'],['candidate','备选'],['adopted','采用'],['rejected','淘汰']].map(([v,n])=>`<option value="${v}" ${v===data.status?'selected':''}>${n}</option>`).join('')}</select></div>
            <div class="field full"><label>备注</label><textarea class="textarea" name="note" placeholder="切入角度、读者问题或素材线索">${esc(data.note||'')}</textarea></div>
            <div class="field full"><label>四维评分</label><div class="score-sliders">${Object.entries(SCORE_LABELS).map(([key,label])=>`<div class="slider-field"><div class="slider-label"><span>${label}</span><strong data-score-value="${key}">${Number(data.scores?.[key]||0)}</strong></div><input type="range" min="0" max="5" step="1" name="score_${key}" value="${Number(data.scores?.[key]||0)}"></div>`).join('')}</div><div class="score-summary"><div><strong id="modalScore">${ideaScore(data)}</strong> / 20</div><span id="modalRecommend" class="badge ${ideaScore(data)>=12?'badge-green':'badge-gray'}">${ideaScore(data)>=12?'推荐制作':'未达推荐线'}</span></div></div>
          </div></div>
          <div class="modal-foot"><button type="button" class="btn" data-close-modal>取消</button><button type="submit" class="btn btn-primary">${idea?'保存修改':'加入创意池'}</button></div>
        </form></div></div>`;
        refreshIdeaSectionOptions(activeIdeaFormDraft.sectionId);
      }

      function refreshIdeaSectionOptions(selectedId='') {
        const select = document.querySelector('#ideaForm [data-idea-section]');
        if (!select) return;
        const sections = stateItems('sections');
        select.innerHTML = renderSectionOptions(selectedId);
        select.disabled = !sections.length;
        if (activeIdeaFormDraft) activeIdeaFormDraft.sectionId = select.value || '';
      }

      function showDraftModal() {
        document.getElementById('modalRoot').innerHTML = `<div class="modal-backdrop" data-modal-backdrop><div class="modal" role="dialog" aria-modal="true"><form id="draftForm"><div class="modal-head"><h3>新建空白稿件</h3><button type="button" class="btn icon-btn btn-ghost" data-close-modal aria-label="关闭">${icons.close}</button></div><div class="modal-body"><div class="form-grid"><div class="field full"><label>标题 *</label><input class="input" name="title" required placeholder="先写一个工作标题" autofocus></div><div class="field"><label>所属板块</label><select class="select" name="sectionId" required ${state.sections?.length?'':'disabled'}>${renderSectionOptions()}</select></div><div class="field"><label>封面类型</label><select class="select" name="coverType">${coverOptions('其他')}</select></div><div class="field full"><label>正文</label><textarea class="textarea" name="body" style="min-height:160px" placeholder="从一句真实的话开始……"></textarea></div></div></div><div class="modal-foot"><button type="button" class="btn" data-close-modal>取消</button><button type="submit" class="btn btn-primary">创建稿件</button></div></form></div></div>`;
      }

      function closeModal(rerender=true) {
        const root = document.getElementById('modalRoot');
        if (!root.firstElementChild) return;
        root.innerHTML='';
        pendingConfirmAction = null;
        activeIdeaFormDraft = null;
        if (rerender) render(); // render() 会根据 activeView 调用当前模块对应的 renderXXX()
      }

      function showImageModal(imageData,title='图片预览') {
        const image = safeImageSrc(imageData); if (!image) return;
        document.getElementById('modalRoot').innerHTML = `<div class="modal-backdrop" data-modal-backdrop><div class="image-viewer" role="dialog" aria-modal="true" aria-label="${escAttr(title)}"><button type="button" class="btn icon-btn image-viewer-close" data-close-modal aria-label="关闭大图">${icons.close}</button><img src="${escAttr(image)}" alt="${escAttr(title)}"></div></div>`;
      }

      function adoptIdea(id) {
        const idea = state.ideas.find(i=>i.id===id);
        if (!idea) return;
        idea.status = 'adopted';
        let draft = state.drafts.find(d=>d?.sourceIdeaId===id || d?.ideaId===id);
        if (!draft) {
          draft = { id:makeId('draft'), sourceIdeaId:id, sectionId:idea.sectionId, title:idea.title, body:'', coverIdea:'', coverType:'其他', coverImage:'', images:[], checklist:Array(6).fill(false), createdAt:nowISO(), updatedAt:nowISO() };
          state.drafts.unshift(draft);
        }
        state.activeDraftId = draft.id;
        saveState(true); render(); toast('已采用并生成备选稿件','正文编辑器已准备好');
      }

      function updateDraftField(id,field,value) {
        const draft = state.drafts.find(d=>d.id===id); if (!draft) return;
        draft[field] = value; draft.updatedAt = nowISO(); saveState();
        if (field==='body') {
          const count = countChars(value); const wordEl=document.getElementById(`word-${id}`); if(wordEl){wordEl.textContent=`${count} / 200 字`;wordEl.classList.toggle('over',count>200);}
          const aiEl=document.getElementById(`ai-${id}`); if(aiEl) aiEl.innerHTML=renderAiResult(draft);
        }
        const previewTitle=document.getElementById(`preview-title-${id}`);if(previewTitle&&field==='title')previewTitle.textContent=value||'标题会显示在这里';
        const previewBody=document.getElementById(`preview-body-${id}`);if(previewBody&&field==='body')previewBody.textContent=value||'正文前两行会显示在这里';
        if(['title','body','coverType'].includes(field)){const previewTagList=document.getElementById(`preview-tags-${id}`);if(previewTagList)previewTagList.innerHTML=previewTags(draft).map(tag=>`<span>${esc(tag)}</span>`).join('');}
      }

      function publishDraft(id) {
        const draft = state.drafts.find(d=>d.id===id); if (!draft) return;
        const missing = (draft.checklist||[]).filter(v=>!v).length;
        if (missing) { toast('还不能发布',`还有 ${missing} 项 checklist 未完成`,'warn'); return; }
        if (!String(draft.title||'').trim() || !String(draft.body||'').trim()) { toast('标题和正文不能为空','','warn'); return; }
        const sourceIdeaId = draft.sourceIdeaId||draft.ideaId||null;
        const sourceIdea = state.ideas.find(i=>i?.id===sourceIdeaId);
        state.published.unshift({ id:makeId('pub'), sourceIdeaId, title:draft.title||'', body:draft.body||'', sectionId:draft.sectionId||sourceIdea?.sectionId||state.sections?.[0]?.id||'', coverIdea:draft.coverIdea||'', coverType:draft.coverType||'其他', coverImage:draft.coverImage||'', images:[...(draft.images||[])], publishedAt:nowISO(), platform:'小红书', metrics:{'24h':blankMetrics(),'7d':blankMetrics(),'30d':blankMetrics()}, mark:'normal', reviewNote:'', createdAt:draft.createdAt||nowISO() });
        state.drafts = state.drafts.filter(d=>d.id!==id);
        saveState(true); render(); toast('已发布并归档','请在24小时后补录第一轮数据');
      }

      function confirmAction(title, detail, onConfirm, dangerous=true) {
        pendingConfirmAction = typeof onConfirm === 'function' ? onConfirm : null;
        document.getElementById('modalRoot').innerHTML = `<div class="modal-backdrop" data-modal-backdrop><div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" style="width:min(430px,100%)"><div class="modal-head"><h3 id="confirmTitle">${esc(title)}</h3><button type="button" class="btn icon-btn btn-ghost" data-close-modal aria-label="关闭">${icons.close}</button></div><div class="modal-body"><p style="margin:0;color:var(--muted)">${esc(detail)}</p></div><div class="modal-foot"><button type="button" class="btn" data-close-modal>取消</button><button type="button" class="btn ${dangerous?'btn-danger':'btn-primary'}" data-action="confirm-action">确认</button></div></div></div>`;
      }

      function requestDeleteSection(id) {
        const section = state.sections.find(s=>s.id===id);
        if (!section) return;
        if (state.sections.length <= 1) { toast('至少保留一个板块','','warn');return; }
        const fallback = state.sections.find(s=>s.id!==id);
        const affected = [...state.ideas,...state.drafts,...state.published].filter(item=>item.sectionId===id).length;
        const detail = affected ? `关联的 ${affected} 条内容将迁移到「${fallback.name}」，不会丢失。` : '该板块暂无关联内容，删除后无法恢复。';
        confirmAction(`删除「${section.name}」？`,detail,()=>{
          [state.ideas,state.drafts,state.published].forEach(list=>list.forEach(item=>{if(item.sectionId===id)item.sectionId=fallback.id;}));
          state.sections=state.sections.filter(s=>s.id!==id);
          if(state.settings.sectionFilter===id)state.settings.sectionFilter='all';
          saveState(true);render();toast('板块已删除',affected?`${affected} 条内容已迁移到「${fallback.name}」`:'' );
        });
      }

      function exportJSON() {
        const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
        downloadBlob(blob,`火花台备份_${new Date().toISOString().slice(0,10)}.json`); toast('完整数据已导出');
      }
      function exportCSV() {
        const rows = [['标题','板块','发布于','阶段','浏览','点赞','收藏','评论','分享','互动率','标记','封面类型']];
        state.published.forEach(p=>{const m=latestMetrics(p);rows.push([p?.title,getSection(p?.sectionId)?.name,p?.publishedAt,m.stage,m.views,m.likes,m.saves,m.comments,m.shares,engagement(m).toFixed(2)+'%',p?.mark,p?.coverType]);});
        const csv='\uFEFF'+rows.map(row=>row.map(cell=>`"${String(cell??'').replace(/"/g,'""')}"`).join(',')).join('\n');
        downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),`内容复盘_${new Date().toISOString().slice(0,10)}.csv`); toast('复盘表已导出');
      }
      function downloadBlob(blob,name) { const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000); }

      document.addEventListener('click', event => {
        const viewButton = event.target.closest('[data-view]');
        if (viewButton) { navigate(viewButton.dataset.view); return; }
        const sectionButton = event.target.closest('[data-section-nav]');
        if (sectionButton) {
          const sectionId=sectionButton.dataset.sectionNav;
          if(sectionId!=='all'&&!stateItems('sections').some(s=>s.id===sectionId))return;
          activeView='ideas';state.settings.activeView='ideas';state.settings.sectionFilter=sectionId;saveState();
          document.getElementById('sidebar').classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'});return;
        }
        if (event.target.closest('[data-close-modal]')) { closeModal(); return; }
        if (event.target.matches('[data-modal-backdrop]')) { closeModal(); return; }
        const filter = event.target.closest('[data-idea-filter]');
        if (filter) { state.settings.ideaFilter=filter.dataset.ideaFilter;saveState();render();return; }
        const stage = event.target.closest('[data-metric-stage]');
        if (stage) { activeMetricStages[stage.dataset.id]=stage.dataset.metricStage;render();return; }
        const mode = event.target.closest('[data-source-mode]');
        if (mode) { const form=document.getElementById('ideaForm');if(!form)return;form.elements.sourceMode.value=mode.dataset.sourceMode;if(activeIdeaFormDraft)activeIdeaFormDraft.sourceMode=mode.dataset.sourceMode;form.querySelectorAll('.mode-option').forEach(b=>b.classList.toggle('active',b===mode));return; }
        const actionTarget = event.target.closest('[data-action]');
        const action = actionTarget?.dataset.action;
        const id = actionTarget?.dataset.id;
        if (!action) {
          const ideaCard = event.target.closest('[data-idea-card]');
          if (ideaCard && !event.target.closest('button,input,select,textarea,a,label')) { showIdeaModal(ideaCard.dataset.ideaCard); return; }
          const publishedCard = event.target.closest('[data-published-card]');
          if (publishedCard && !event.target.closest('button,input,select,textarea,a,label')) { showPublishedDetail(publishedCard.dataset.publishedCard); return; }
          return;
        }
        const actions = {
          'add-idea':()=>showIdeaModal(), 'auto-idea':()=>showIdeaModal(null,'auto'), 'edit-idea':()=>showIdeaModal(id), 'adopt-idea':()=>adoptIdea(id),
          'delete-idea':()=>confirmAction('删除这条创意？','对应稿件和发布记录不会被删除。',()=>{state.ideas=state.ideas.filter(i=>i.id!==id);saveState(true);render();toast('创意已删除');}),
          'add-draft':()=>showDraftModal(),
          'select-draft':()=>selectActiveDraft(id),
          'delete-draft':()=>confirmAction('删除这篇备选稿？','删除后无法恢复，原创意仍会保留。',()=>{state.drafts=state.drafts.filter(d=>d.id!==id);saveState(true);render();toast('备选稿已删除');}),
          'duplicate-draft':()=>{const d=state.drafts.find(x=>x.id===id);if(d){if(storedImageBytes()+draftImageBytes(d)>STORAGE_IMAGE_LIMIT){toast('图片总大小将超过 3MB','请先删除部分图片再复制稿件','warn');return;}const copy=clone(d);copy.id=makeId('draft');copy.title+=' · 副本';copy.ideaId=null;copy.createdAt=copy.updatedAt=nowISO();state.drafts.unshift(copy);saveState(true);render();toast('稿件副本已创建');}},
          'select-cover-image':()=>actionTarget.closest('[data-draft-card]')?.querySelector('[data-cover-image-input]')?.click(),
          'remove-cover-image':()=>{const d=state.drafts.find(x=>x.id===id);if(d){d.coverImage='';d.updatedAt=nowISO();saveState(true);render();toast('封面图已删除');}},
          'select-body-images':()=>actionTarget.closest('[data-draft-card]')?.querySelector('[data-body-images-input]')?.click(),
          'remove-body-image':()=>{const d=state.drafts.find(x=>x.id===id);const index=Number(actionTarget.dataset.index);if(d&&Number.isInteger(index)&&index>=0&&index<d.images.length){d.images.splice(index,1);d.updatedAt=nowISO();saveState(true);render();toast('配图已删除');}},
          'publish-draft':()=>publishDraft(id),
          'view-published-cover':()=>{const pub=state.published.find(p=>p.id===id);if(pub)showImageModal(pub.coverImage,pub.title||'封面图预览');},
          'view-published-detail':()=>showPublishedDetail(id),
          'delete-published':()=>confirmAction('删除这条发布记录？','所有阶段数据会一起删除，建议先导出备份。',()=>{state.published=state.published.filter(p=>p.id!==id);saveState(true);render();toast('发布记录已删除');}),
          'export-json':exportJSON, 'export-csv':exportCSV, 'import-json':()=>document.getElementById('importFile').click(),
          'load-demo':()=>confirmAction('载入示例数据？','当前数据会被示例数据覆盖，建议先导出备份。',()=>{state=defaultState();activeView='ideas';saveState(true);render();toast('示例数据已载入');}),
          'clear-data':()=>confirmAction('清空全部内容数据？','创意、稿件和发布数据都会被清空；板块与运营原则会保留。此操作无法撤销。',()=>{const clean=defaultState();clean.sections=clone(state.sections);clean.principles=clone(state.principles);clean.settings={...state.settings};clean.ideas=[];clean.drafts=[];clean.published=[];state=clean;saveState(true);render();toast('全部内容数据已清空','','error');}),
          'reset-principles':()=>confirmAction('恢复默认20条原则？','当前原则文字和开关状态会被覆盖。',()=>{state.principles=defaultPrinciples.map((text,index)=>({id:`rule_${index+1}`,text,enabled:true}));saveState(true);render();toast('运营原则已恢复默认');},false),
          'add-section':showSectionModal,
          'delete-section':()=>requestDeleteSection(id),
          'toggle-mobile-menu':()=>document.getElementById('sidebar')?.classList.toggle('open'),
          'confirm-action':()=>{const callback=pendingConfirmAction;closeModal(false);callback?.();}
        };
        actions[action]?.();
      });

      document.addEventListener('input', event => {
        if (event.target.matches('[data-draft-search]')) {
          draftSearchQuery=event.target.value||'';
          const list=document.getElementById('draftItems');
          if(list)list.innerHTML=renderDraftSidebarItems();
          return;
        }
        const range = event.target.closest('#ideaForm input[type="range"]');
        if (range) {
          const key=range.name.replace('score_',''); const form=document.getElementById('ideaForm');
          if(!form)return;
          const scoreValue=form.querySelector(`[data-score-value="${key}"]`);if(scoreValue)scoreValue.textContent=range.value;
          const total=Object.keys(SCORE_LABELS).reduce((s,k)=>s+Number(form.elements[`score_${k}`].value),0);
          const modalScore=document.getElementById('modalScore');const badge=document.getElementById('modalRecommend');if(modalScore)modalScore.textContent=total;if(badge){badge.textContent=total>=12?'推荐制作':'未达推荐线';badge.className=`badge ${total>=12?'badge-green':'badge-gray'}`;}
          return;
        }
        if (event.target.matches('[data-draft-field]')) updateDraftField(event.target.dataset.id,event.target.dataset.draftField,event.target.value);
        if (event.target.matches('[data-principle-text]')) { const p=state.principles.find(x=>x.id===event.target.dataset.id);if(p){p.text=event.target.value;saveState();} }
        if (event.target.matches('[data-published-review]')) { const p=state.published.find(x=>x?.id===event.target.dataset.id);if(p){p.reviewNote=event.target.value;saveState();} }
      });

      document.addEventListener('change', event => {
        if (event.target.matches('#ideaForm [data-idea-section]')) {
          const sectionId=String(event.target.value||'');
          if(!stateItems('sections').some(section=>section?.id===sectionId)){refreshIdeaSectionOptions(activeIdeaFormDraft?.sectionId||'');toast('请选择有效板块','','warn');return;}
          if(activeIdeaFormDraft)activeIdeaFormDraft.sectionId=sectionId;
          return;
        }
        if (event.target.id==='importFile') {
          const file=event.target.files?.[0];if(!file)return;
          file.text().then(text=>{const raw=JSON.parse(text);if(!raw||!Array.isArray(raw.ideas)||!Array.isArray(raw.drafts)||!Array.isArray(raw.published))throw new Error('结构不完整');state=normalizeState(raw);activeView=navItems.some(item=>item.id===state.settings.activeView)?state.settings.activeView:'ideas';state.settings.activeView=activeView;saveState(true);render();toast('数据导入成功',`已恢复 ${state.ideas.length+state.drafts.length+state.published.length} 条内容记录`);}).catch(error=>toast('导入失败',error.message||'文件不是有效备份','error')).finally(()=>{event.target.value='';});return;
        }
        if (event.target.matches('[data-cover-image-input]')) { const file=event.target.files[0];event.target.value='';if(file)setDraftCoverImage(event.target.dataset.id,file);return; }
        if (event.target.matches('[data-body-images-input]')) { const files=Array.from(event.target.files||[]);event.target.value='';if(files.length)addDraftImages(event.target.dataset.id,files);return; }
        if (event.target.matches('[data-draft-field]')) updateDraftField(event.target.dataset.id,event.target.dataset.draftField,event.target.value);
        if (event.target.matches('[data-check-index]')) {
          const d=state.drafts.find(x=>x.id===event.target.dataset.id);if(!d)return;d.checklist[Number(event.target.dataset.checkIndex)]=event.target.checked;d.updatedAt=nowISO();saveState();
          const checked=d.checklist.filter(Boolean).length;const checkCount=document.getElementById(`check-count-${d.id}`);const progress=document.getElementById(`progress-${d.id}`);if(checkCount)checkCount.textContent=`${checked}/6`;if(progress)progress.style.width=`${checked/6*100}%`;
        }
        if (event.target.matches('[data-metric-field]')) {
          const p=state.published.find(x=>x?.id===event.target.dataset.id);if(!p)return;const stage=event.target.dataset.stage;p.metrics ||= {};p.metrics[stage]={...blankMetrics(),...(p.metrics?.[stage]||{})};p.metrics[stage][event.target.dataset.metricField]=Math.max(0,Number(event.target.value||0));saveState();
          const card=event.target.closest('[data-published-card]');if(card){const rate=card.querySelector('.published-foot .word-count');if(rate)rate.textContent=`互动率 ${engagement(p.metrics?.[stage]||blankMetrics()).toFixed(1)}%`;}
        }
        if (event.target.matches('[data-published-mark]')) { const p=state.published.find(x=>x.id===event.target.dataset.id);if(p){p.mark=event.target.value;saveState(true);render();} }
        if (event.target.matches('[data-principle-toggle]')) { const p=state.principles.find(x=>x.id===event.target.dataset.id);if(p){p.enabled=event.target.checked;saveState();render();} }
        if (event.target.matches('[data-section-field]')) {
          const s=state.sections.find(x=>x.id===event.target.dataset.id);if(!s)return;
          const field=event.target.dataset.sectionField;
          const value=field==='ratio'?Math.min(100,Math.max(0,Number(event.target.value||0))):String(event.target.value).trim();
          if((field==='name'||field==='icon')&&!value){event.target.value=s[field];toast(field==='name'?'板块名称不能为空':'板块图标不能为空','','warn');return;}
          s[field]=value;saveState(true);render();toast('板块设置已更新');
        }
      });

      document.addEventListener('submit', event => {
        event.preventDefault();
        if (event.target.id==='ideaForm') {
          const form=event.target;const fd=new FormData(form);const editId=form.dataset.editId;
          const ideas=stateItems('ideas');const original=editId?ideas.find(i=>i?.id===editId):null;
          const item={ ...(original||{}), ...(activeIdeaFormDraft||{}), id:editId||makeId('idea'), title:String(fd.get('title')||'').trim(), sourceMode:String(fd.get('sourceMode')||'manual'), source:String(fd.get('source')||'').trim()||'手动记录', sectionId:String(fd.get('sectionId')||activeIdeaFormDraft?.sectionId||''), status:String(fd.get('status')||'pending'), note:String(fd.get('note')||'').trim(), scores:Object.fromEntries(Object.keys(SCORE_LABELS).map(k=>[k,Number(fd.get(`score_${k}`)||0)])), createdAt:original?.createdAt||nowISO(), updatedAt:nowISO() };
          if(!item.title){toast('请填写创意标题','','warn');return;}
          if(!item.sectionId||!stateItems('sections').some(section=>section?.id===item.sectionId)){toast('请选择有效板块','若列表为空，请先在设置中添加板块','warn');refreshIdeaSectionOptions(item.sectionId);return;}
          if(!Array.isArray(state.ideas))state.ideas=[];
          if(editId){const idx=state.ideas.findIndex(i=>i?.id===editId);if(idx<0){toast('保存失败','原创意已不存在','error');return;}state.ideas[idx]=item;}else state.ideas.unshift(item);
          closeModal(false);if(item.status==='adopted')adoptIdea(item.id);else{saveState(true);render();toast(editId?'创意已更新':'创意已加入池中',ideaScore(item)>=12?'达到12分，推荐制作':'可以继续评估');}
        }
        if (event.target.id==='draftForm') {
          const fd=new FormData(event.target);const sectionId=String(fd.get('sectionId')||'');if(!state.sections.some(section=>section?.id===sectionId)){toast('请选择有效板块','','warn');return;}const draft={id:makeId('draft'),sourceIdeaId:null,sectionId,title:String(fd.get('title')).trim(),body:String(fd.get('body')||''),coverIdea:'',coverType:String(fd.get('coverType')),coverImage:'',images:[],checklist:Array(6).fill(false),createdAt:nowISO(),updatedAt:nowISO()};state.drafts.unshift(draft);state.activeDraftId=draft.id;closeModal(false);saveState(true);render();toast('空白稿件已创建');
        }
        if (event.target.id==='sectionForm') {
          const fd=new FormData(event.target);const name=String(fd.get('name')||'').trim();const icon=String(fd.get('icon')||'').trim();
          if(!name||!icon){toast('请填写板块名称和图标','','warn');return;}
          if(state.sections.some(s=>s.name===name)){toast('板块名称已存在','请换一个名称','warn');return;}
          const section={id:makeId('section'),name,icon,color:String(fd.get('color')||'#2563eb'),ratio:0};
          state.sections.push(section);closeModal(false);saveState(true);render();toast('板块已创建',`${icon} ${name} 已加入导航和选择列表`);
        }
      });

      document.addEventListener('dragover',event=>{const zone=event.target.closest('[data-cover-dropzone]');if(!zone)return;event.preventDefault();zone.classList.add('dragging');});
      document.addEventListener('dragleave',event=>{const zone=event.target.closest('[data-cover-dropzone]');if(zone&&!zone.contains(event.relatedTarget))zone.classList.remove('dragging');});
      document.addEventListener('drop',event=>{const zone=event.target.closest('[data-cover-dropzone]');if(!zone)return;event.preventDefault();zone.classList.remove('dragging');const file=event.dataTransfer.files[0];if(file)setDraftCoverImage(zone.dataset.coverDropzone,file);});
      document.addEventListener('keydown',event=>{const coverUpload=event.target.closest('[data-cover-dropzone]');if(coverUpload&&event.target===coverUpload&&(event.key==='Enter'||event.key===' ')){event.preventDefault();coverUpload.click();return;}const ideaCard=event.target.matches?.('[data-idea-card]')?event.target:null;if(ideaCard&&(event.key==='Enter'||event.key===' ')){event.preventDefault();showIdeaModal(ideaCard.dataset.ideaCard);return;}const publishedCard=event.target.matches?.('[data-published-card]')?event.target:null;if(publishedCard&&(event.key==='Enter'||event.key===' ')){event.preventDefault();showPublishedDetail(publishedCard.dataset.publishedCard);return;}if(event.key==='Escape')closeModal();if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();showIdeaModal();}});

      window.ContentPlatformAPI = Object.freeze({
        version: APP_VERSION,
        getState: () => clone(state),
        upsertIdea: idea => {
          if (!idea || !String(idea.title||'').trim()) throw new Error('idea.title 不能为空');
          const existing = idea.id ? state.ideas.findIndex(i=>i.id===idea.id) : -1;
          const normalized = { id:idea.id||makeId('idea'), title:String(idea.title).trim(), sourceMode:idea.sourceMode||'auto', source:idea.source||'外部模块', sectionId:idea.sectionId||state.sections[0]?.id, scores:{intensity:0,whitespace:0,persona:0,timeliness:0,...(idea.scores||{})}, status:idea.status||'pending', note:idea.note||'', createdAt:idea.createdAt||nowISO() };
          if(existing>=0)state.ideas[existing]=normalized;else state.ideas.unshift(normalized);saveState(true);render();return clone(normalized);
        },
        registerModule: (name, renderFn) => { if(typeof renderFn!=='function')throw new Error('renderFn 必须是函数');extensionModules.set(name,renderFn);const slot=document.getElementById('fourS-extension');if(slot)slot.innerHTML=renderFn(clone(state));return()=>extensionModules.delete(name); },
        subscribe: callback => { if(typeof callback!=='function')throw new Error('callback 必须是函数');subscribers.add(callback);return()=>subscribers.delete(callback); }
      });

      saveState(true);
      render();
    })();
  </script>
</body>
</html>
