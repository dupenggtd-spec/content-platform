<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f9fa">
  <title>火花台 · 自媒体创意管理平台</title>
  <style>
    :root {
      --bg: #f8f9fa;
      --panel: #ffffff;
      --panel-2: #f9fafb;
      --panel-3: #eff6ff;
      --border: #e5e7eb;
      --border-soft: #eef0f2;
      --text: #1f2937;
      --muted: #6b7280;
      --subtle: #9ca3af;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --green: #10b981;
      --green-soft: #ecfdf5;
      --yellow: #f59e0b;
      --yellow-soft: #fffbeb;
      --red: #ef4444;
      --red-soft: #fef2f2;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --purple: #8b5cf6;
      --shadow: 0 1px 3px rgba(0, 0, 0, .08);
      --radius: 14px;
      --sidebar: 244px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.55;
    }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    ::selection { background: rgba(248, 81, 73, .32); }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #30363d; border: 2px solid var(--bg); border-radius: 99px; }

    .app { min-height: 100vh; }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar);
      display: flex;
      flex-direction: column;
      padding: 22px 14px 16px;
      background: #0b0f14;
      border-right: 1px solid var(--border);
      z-index: 40;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 9px 25px; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center;
      background: linear-gradient(145deg, #ff7068, #d92d27); box-shadow: 0 8px 24px rgba(248, 81, 73, .22);
    }
    .brand-mark svg { width: 20px; height: 20px; }
    .brand-name { font-size: 17px; font-weight: 750; letter-spacing: .04em; }
    .brand-sub { color: var(--muted); font-size: 10px; letter-spacing: .12em; margin-top: -2px; }
    .nav-label { padding: 0 10px 8px; color: var(--subtle); font-size: 11px; letter-spacing: .12em; }
    .nav { display: grid; gap: 5px; }
    .nav-item {
      width: 100%; display: flex; align-items: center; gap: 11px; padding: 10px 11px;
      border: 1px solid transparent; border-radius: 9px; background: transparent; cursor: pointer;
      color: #a8b1bb; text-align: left; transition: .18s ease;
    }
    .nav-item:hover { background: rgba(255,255,255,.04); color: var(--text); }
    .nav-item.active { background: var(--primary-soft); border-color: rgba(248,81,73,.23); color: #ff746d; }
    .nav-icon { width: 19px; height: 19px; display: grid; place-items: center; flex: 0 0 auto; }
    .nav-icon svg { width: 18px; height: 18px; }
    .nav-name { flex: 1; font-weight: 600; }
    .nav-count { min-width: 21px; padding: 1px 6px; border-radius: 99px; background: rgba(255,255,255,.07); color: var(--muted); text-align: center; font-size: 11px; }
    .nav-item.active .nav-count { color: #ff8b85; background: rgba(248,81,73,.16); }
    .sidebar-footer { margin-top: auto; padding: 14px 9px 0; border-top: 1px solid var(--border-soft); }
    .save-state { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; }
    .save-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
    .sidebar-tip { margin-top: 8px; color: var(--subtle); font-size: 10px; }

    .main { margin-left: var(--sidebar); min-height: 100vh; }
    .topbar {
      position: sticky; top: 0; z-index: 30; height: 68px; padding: 0 30px;
      display: flex; align-items: center; justify-content: space-between; gap: 18px;
      background: rgba(13, 17, 23, .88); border-bottom: 1px solid rgba(48,54,61,.75);
      backdrop-filter: blur(14px);
    }
    .page-kicker { color: var(--primary); font-size: 11px; letter-spacing: .1em; font-weight: 700; }
    .page-title { margin: 1px 0 0; font-size: 19px; line-height: 1.3; }
    .top-actions { display: flex; align-items: center; gap: 9px; }
    .content { max-width: 1500px; margin: 0 auto; padding: 26px 30px 60px; }

    .btn {
      border: 1px solid var(--border); background: var(--panel-2); color: #d8dee4;
      min-height: 36px; padding: 7px 13px; display: inline-flex; align-items: center; justify-content: center;
      gap: 7px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: .17s ease; white-space: nowrap;
    }
    .btn:hover { border-color: #4a535e; background: #222b36; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn svg { width: 16px; height: 16px; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    .btn-ghost { background: transparent; }
    .btn-danger { color: #ff7b72; border-color: rgba(248,81,73,.35); background: var(--primary-soft); }
    .btn-success { color: #6de37c; border-color: rgba(63,185,80,.35); background: var(--green-soft); }
    .btn-sm { min-height: 30px; padding: 5px 9px; font-size: 12px; border-radius: 7px; }
    .icon-btn { width: 34px; height: 34px; padding: 0; border-radius: 8px; }
    .mobile-menu { display: none; }

    .hero {
      position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, .75fr);
      gap: 24px; align-items: center; padding: 27px 29px; margin-bottom: 22px; border: 1px solid var(--border);
      border-radius: var(--radius); background: linear-gradient(125deg, #171d25 0%, #151a21 72%); box-shadow: var(--shadow);
    }
    .hero::after { content:""; position:absolute; width:280px; height:280px; right:-110px; top:-150px; background:rgba(248,81,73,.1); filter:blur(2px); border-radius:50%; }
    .hero h2 { margin: 0 0 8px; font-size: clamp(22px, 3vw, 32px); letter-spacing: -.035em; }
    .hero p { margin: 0; max-width: 660px; color: var(--muted); }
    .hero-accent { color: #ff746d; }
    .hero-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; position: relative; z-index: 1; }
    .hero-stat { padding: 14px 12px; background: rgba(13,17,23,.62); border: 1px solid var(--border-soft); border-radius: 11px; }
    .hero-stat strong { display: block; font-size: 23px; line-height: 1.25; }
    .hero-stat span { color: var(--muted); font-size: 11px; }

    .stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 13px; margin-bottom: 20px; }
    .stat-card { padding: 17px 18px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); }
    .stat-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 12px; }
    .stat-icon { width: 29px; height: 29px; border-radius: 8px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); }
    .stat-icon svg { width: 15px; height: 15px; }
    .stat-value { font-size: 26px; font-weight: 750; margin: 7px 0 2px; letter-spacing: -.03em; }
    .stat-note { color: var(--subtle); font-size: 11px; }

    .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 28px 0 13px; }
    .section-head:first-child { margin-top: 0; }
    .section-head h2 { margin: 0; font-size: 18px; }
    .section-head p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .filter-btn { border: 1px solid var(--border); border-radius: 99px; padding: 5px 11px; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; }
    .filter-btn.active, .filter-btn:hover { border-color: rgba(248,81,73,.35); background: var(--primary-soft); color: #ff817b; }

    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 14px; }
    .card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); box-shadow: 0 8px 25px rgba(0,0,0,.12); }
    .card-pad { padding: 18px; }
    .idea-card { padding: 18px; display: flex; flex-direction: column; min-height: 290px; cursor:pointer; transition: border-color .18s, transform .18s; }
    .idea-card:hover { border-color: #48515c; transform: translateY(-2px); }
    .idea-card.recommended { border-color: rgba(63,185,80,.38); background: linear-gradient(145deg, rgba(63,185,80,.045), var(--panel) 42%); }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .eyebrow { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; color: var(--muted); font-size: 11px; }
    .source-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }
    .source-dot.manual { background: var(--yellow); }
    .idea-title { margin: 11px 0 7px; font-size: 17px; line-height: 1.45; }
    .idea-note { margin: 0 0 17px; color: var(--muted); font-size: 12px; min-height: 38px; }
    .score-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-top: auto; }
    .score-item { padding: 9px 5px; text-align: center; border: 1px solid var(--border-soft); background: rgba(255,255,255,.018); border-radius: 8px; }
    .score-item strong { display:block; color:#dfe5eb; font-size: 16px; }
    .score-item span { display:block; color:var(--subtle); font-size:10px; }
    .card-foot { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:15px; padding-top:13px; border-top:1px solid var(--border-soft); }
    .total-score { display:flex; align-items:baseline; gap:5px; }
    .total-score strong { font-size:21px; }
    .total-score span { color:var(--muted); font-size:11px; }
    .total-score.good strong { color:#65d975; }
    .action-row { display:flex; align-items:center; gap:6px; }
    .badge { display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border-radius:99px; font-size:11px; font-weight:600; border:1px solid transparent; }
    .badge-green { color:#65d975; background:var(--green-soft); border-color:rgba(63,185,80,.21); }
    .badge-red { color:#ff7b72; background:var(--primary-soft); border-color:rgba(248,81,73,.2); }
    .badge-yellow { color:#e6b94f; background:var(--yellow-soft); border-color:rgba(210,153,34,.2); }
    .badge-blue { color:#79b8ff; background:var(--blue-soft); border-color:rgba(88,166,255,.2); }
    .badge-gray { color:#a0a8b1; background:rgba(139,148,158,.1); border-color:rgba(139,148,158,.16); }
    .badge-purple { color:#c9a7ff; background:rgba(188,140,255,.11); border-color:rgba(188,140,255,.2); }

    .empty { grid-column:1/-1; padding:58px 25px; border:1px dashed var(--border); border-radius:var(--radius); text-align:center; color:var(--muted); }
    .empty-icon { width:52px; height:52px; margin:0 auto 13px; border-radius:15px; display:grid; place-items:center; background:var(--panel-2); color:var(--subtle); }
    .empty-icon svg { width:25px; height:25px; }
    .empty strong { display:block; color:#c9d1d9; margin-bottom:5px; }

    .draft-workspace { display:grid; grid-template-columns:280px minmax(0,1fr); gap:16px; align-items:start; }
    .draft-sidebar {
      position:sticky; top:88px; height:calc(100vh - 110px); min-height:480px; overflow:hidden;
      display:flex; flex-direction:column; background:#fff;
    }
    .draft-sidebar-head { padding:14px; border-bottom:1px solid var(--border); }
    .draft-search-wrap { position:relative; }
    .draft-search-icon { position:absolute; left:10px; top:50%; width:16px; height:16px; color:var(--subtle); transform:translateY(-50%); pointer-events:none; }
    .draft-search { padding-left:34px; }
    .draft-items { min-height:0; flex:1; overflow-y:auto; padding:8px; }
    .draft-list-empty { padding:34px 12px; color:var(--muted); text-align:center; font-size:12px; }
    .draft-list-item {
      width:100%; min-width:0; display:grid; grid-template-columns:80px minmax(0,1fr); gap:10px; align-items:center;
      padding:9px; border:1px solid transparent; border-radius:10px; background:transparent; text-align:left; cursor:pointer;
      transition:background .16s,border-color .16s;
    }
    .draft-list-item + .draft-list-item { margin-top:4px; }
    .draft-list-item:hover { background:#f9fafb; border-color:var(--border-soft); }
    .draft-list-item.active { background:#eff6ff; border-color:#bfdbfe; }
    .draft-list-thumb {
      width:80px; height:60px; overflow:hidden; display:grid; place-items:center; border:1px solid var(--border);
      border-radius:8px; background:#f3f4f6; color:var(--subtle); font-size:20px;
    }
    .draft-list-thumb img { width:100%; height:100%; display:block; object-fit:cover; }
    .draft-list-copy { min-width:0; }
    .draft-list-title { display:block; overflow:hidden; color:var(--text); font-size:13px; font-weight:650; text-overflow:ellipsis; white-space:nowrap; }
    .draft-list-meta { display:flex; gap:5px; align-items:center; margin-top:8px; min-width:0; }
    .draft-list-meta .badge { max-width:92px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:2px 6px; font-size:10px; }
    .draft-sidebar-foot { padding:12px 14px; border-top:1px solid var(--border); background:#fff; }
    .draft-sidebar-foot .btn { width:100%; }
    .draft-detail { overflow:hidden; }
    .draft-detail-inner { padding:22px; }
    .draft-card { min-width:0; overflow:hidden; display:grid; grid-template-columns:minmax(0,1fr) minmax(280px,.55fr); }
    .editor-pane,.review-pane { min-width:0; padding:22px; }
    .review-pane { border-left:1px solid var(--border-soft); }
    .draft-detail-empty { min-height:480px; display:grid; place-items:center; }
    .draft-detail-empty .empty { width:100%; border:0; }
    .draft-detail-section { padding:20px 0; border-top:1px solid var(--border-soft); }
    .draft-detail-section:first-of-type { margin-top:18px; }
    .draft-detail-section .publish-preview { margin-top:0; }
    .editor-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .draft-title-input { width:100%; padding:0 0 9px; border:0; border-bottom:1px solid var(--border); outline:none; background:transparent; color:var(--text); font-size:20px; font-weight:700; }
    .draft-title-input:focus { border-color:var(--primary); }
    .draft-source { min-height:20px; margin:7px 0 0; color:var(--muted); font-size:11px; }
    .draft-source strong { color:var(--primary); font-weight:600; }
    .editor-meta { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:10px 0 7px; }
    .field-label { color:var(--muted); font-size:11px; font-weight:600; letter-spacing:.06em; }
    .word-count { color:var(--muted); font-size:11px; }
    .word-count.over { color:#ff7b72; }
    .body-editor { width:100%; min-height:225px; resize:vertical; padding:14px; border:1px solid var(--border); outline:none; border-radius:10px; background:#0f141a; color:#e6edf3; line-height:1.85; }
    .body-editor:focus, .input:focus, .select:focus, .textarea:focus { border-color:rgba(248,81,73,.75); box-shadow:0 0 0 3px rgba(248,81,73,.08); }
    .cover-row { display:grid; grid-template-columns:1fr 155px; gap:9px; margin-top:10px; }
    .media-editor { margin-top:0; }
    .media-section + .media-section { margin-top:16px; }
    .media-section-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; }
    .media-help { color:var(--subtle); font-size:11px; }
    .cover-upload {
      position:relative; width:200px; height:150px; overflow:hidden; display:grid; place-items:center;
      border:1px dashed #e5e7eb; border-radius:8px; background:#fff; cursor:pointer;
      transition:border-color .18s, background .18s;
    }
    .cover-upload:hover { border-color:#2563eb; }
    .cover-upload.dragging { border:2px dashed #2563eb; background:#eff6ff; }
    .cover-upload img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .18s; }
    .cover-upload.has-image:hover img { transform:scale(1.05); }
    .cover-placeholder { display:grid; place-items:center; gap:5px; color:var(--muted); text-align:center; }
    .cover-placeholder .camera { font-size:27px; line-height:1; }
    .cover-placeholder strong { color:#4b5563; font-size:12px; }
    .image-remove {
      position:absolute; top:6px; right:6px; z-index:2; width:24px; height:24px; padding:0;
      display:grid; place-items:center; border:0; border-radius:50%; background:rgba(239,68,68,.94);
      color:#fff; cursor:pointer; font-size:16px; line-height:1; box-shadow:0 2px 8px rgba(0,0,0,.18);
    }
    .image-remove:hover { background:#dc2626; transform:scale(1.06); }
    .inline-images { display:flex; gap:9px; overflow-x:auto; padding:2px 2px 8px; }
    .inline-image { position:relative; width:100px; height:100px; flex:0 0 100px; }
    .inline-image img { width:100%; height:100%; display:block; object-fit:cover; border:1px solid #e5e7eb; border-radius:8px; transition:transform .18s; }
    .inline-image:hover img { transform:scale(1.05); }
    .inline-image .image-remove { top:5px; right:5px; }
    .add-images-btn { margin-top:2px; }
    .image-limit { margin-left:7px; color:var(--subtle); font-size:11px; }
    .publish-preview { margin-top:18px; padding:14px; border:1px solid var(--border); border-radius:11px; background:#f9fafb; }
    .publish-preview-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .publish-preview-head strong { font-size:13px; }
    .publish-preview-head span { color:var(--subtle); font-size:9px; letter-spacing:.12em; }
    .xhs-preview { overflow:hidden; max-width:390px; border:1px solid #e5e7eb; border-radius:10px; background:#fff; box-shadow:0 2px 9px rgba(31,41,55,.05); }
    .xhs-preview-cover { width:100%; max-height:260px; display:block; object-fit:cover; background:#f3f4f6; }
    .xhs-preview-copy { padding:12px 13px 13px; }
    .xhs-preview-title { margin:0 0 6px; color:#111827; font-size:15px; line-height:1.45; }
    .xhs-preview-body { margin:0; color:#4b5563; font-size:12px; line-height:1.65; white-space:pre-line; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .xhs-preview-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; color:#2563eb; font-size:11px; }
    .review-title { margin:0 0 12px; display:flex; align-items:center; justify-content:space-between; font-size:14px; }
    .ai-result { padding:11px 12px; border:1px solid var(--border-soft); border-radius:9px; background:var(--panel-2); margin-bottom:16px; }
    .ai-result.clean { border-color:rgba(63,185,80,.25); background:var(--green-soft); }
    .ai-result.warn { border-color:rgba(210,153,34,.26); background:var(--yellow-soft); }
    .ai-result-head { display:flex; gap:8px; align-items:center; margin-bottom:5px; font-weight:650; font-size:12px; }
    .ai-result ul { margin:6px 0 0; padding-left:18px; color:#c3a955; font-size:11px; }
    .ai-result.clean p { color:#73d680; }
    .ai-result p { margin:0; color:var(--muted); font-size:11px; }
    .checklist { display:grid; gap:7px; margin-bottom:17px; }
    .check-item { display:flex; align-items:flex-start; gap:9px; padding:8px 9px; border:1px solid transparent; border-radius:7px; cursor:pointer; color:#b8c0c9; font-size:12px; }
    .check-item:hover { background:rgba(255,255,255,.025); }
    .check-item input { appearance:none; width:16px; height:16px; margin:1px 0 0; border:1px solid #59636e; border-radius:4px; flex:0 0 auto; cursor:pointer; }
    .check-item input:checked { background:var(--green); border-color:var(--green); box-shadow:inset 0 0 0 3px var(--panel); }
    .check-item:has(input:checked) { color:#738077; text-decoration:line-through; }
    .progress { height:6px; background:#e5e7eb; border-radius:99px; overflow:hidden; }
    .progress-bar { height:100%; background:linear-gradient(90deg,var(--primary),#ff857f); border-radius:inherit; transition:width .2s; }
    .review-actions { display:grid; grid-template-columns:1fr auto; gap:8px; margin-top:18px; }
    .review-actions .btn-primary { min-height:42px; }

    .published-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(370px,1fr)); gap:15px; }
    .published-card { overflow:hidden; cursor:pointer; }
    .published-card:focus-within { border-color:#bfdbfe; }
    .published-main { padding:18px; }
    .published-summary { display:flex; align-items:flex-start; gap:13px; }
    .published-copy { min-width:0; flex:1; }
    .published-cover-button { width:80px; height:80px; flex:0 0 80px; padding:0; overflow:hidden; border:1px solid #e5e7eb; border-radius:8px; background:#f9fafb; cursor:zoom-in; }
    .published-cover-button img { width:100%; height:100%; display:block; object-fit:cover; transition:transform .18s; }
    .published-cover-button:hover { border-color:#2563eb; }
    .published-cover-button:hover img { transform:scale(1.05); }
    .published-title { margin:9px 0 4px; font-size:17px; }
    .published-excerpt { margin:0; color:var(--muted); font-size:11px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .metric-tabs { display:flex; gap:5px; margin:15px 0 10px; }

      function normalizeState(raw) {
        const base = defaultState();
        if (!raw || typeof raw !== 'object') return base;
        const merged = {
          ...base, ...raw,
          meta: { ...base.meta, ...(raw.meta || {}) },
          settings: { ...base.settings, ...(raw.settings || {}) },
          sections: Array.isArray(raw.sections) && raw.sections.length ? raw.sections : base.sections,
          ideas: Array.isArray(raw.ideas) ? raw.ideas : base.ideas,
          drafts: Array.isArray(raw.drafts) ? raw.drafts : base.drafts,
          published: Array.isArray(raw.published) ? raw.published : base.published,
          principles: Array.isArray(raw.principles) && raw.principles.length ? raw.principles : base.principles
        };
        merged.ideas = merged.ideas.map(i => {
          const item = i && typeof i === 'object' ? i : {};
          return { note:'', sourceMode:'manual', source:'手动记录', status:'pending', scores:{intensity:0,whitespace:0,persona:0,timeliness:0}, createdAt:nowISO(), ...item, scores:{intensity:0,whitespace:0,persona:0,timeliness:0,...(item.scores||{})} };
        });
        merged.drafts = merged.drafts.map(d => {
          const item = d && typeof d === 'object' ? d : {};
          const normalized = { body:'', coverIdea:'', coverType:'其他', coverImage:'', images:[], checklist:Array(6).fill(false), createdAt:nowISO(), updatedAt:nowISO(), ...item, sourceIdeaId:item.sourceIdeaId||item.ideaId||null, coverImage:safeImageSrc(item.coverImage), images:Array.isArray(item.images)?item.images.map(safeImageSrc).filter(Boolean).slice(0,MAX_BODY_IMAGES):[], checklist:CHECKLIST_LABELS.map((_,i)=>Boolean(item.checklist?.[i])) };
          delete normalized.ideaId;
          return normalized;
        });
        merged.published = merged.published.map(p => {
          const item = p && typeof p === 'object' ? p : {};
          return {
            body:'', coverIdea:'', coverType:'其他', coverImage:'', images:[], publishedAt:nowISO(),
            platform:'小红书', mark:'normal', reviewNote:'', ...item,
            coverImage:safeImageSrc(item.coverImage),
            images:Array.isArray(item.images)?item.images.map(safeImageSrc).filter(Boolean).slice(0,MAX_BODY_IMAGES):[],
            metrics:Object.fromEntries(STAGES.map(stage=>[stage,{...blankMetrics(),...(item.metrics?.[stage]||{})}]))
          };
        });
        const fallbackIcons = ['📁','✨','📝','🎯','💡','📊'];
        merged.sections = merged.sections.map((section,index) => {
          section = section && typeof section === 'object' ? section : {};
          return {
            id:section.id || makeId('section'),
            name:String(section.name || `板块 ${index+1}`),
            icon:String(section.icon || fallbackIcons[index % fallbackIcons.length]),
            color:section.color || '#2563eb',
            ratio:Number(section.ratio || 0)
          };
        });
        if (merged.settings.sectionFilter !== 'all' && !merged.sections.some(s => s.id === merged.settings.sectionFilter)) merged.settings.sectionFilter = 'all';
        if (!merged.drafts.some(d => d.id === merged.activeDraftId)) merged.activeDraftId = merged.drafts[0]?.id || null;
        return merged;
      }

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (!saved) return defaultState();
          const normalized = normalizeState(saved);
          if (saved.version !== APP_VERSION) {
            normalized.published = [];
            normalized.drafts = defaultState().drafts;
            normalized.activeDraftId = 'draft_ai_image';
          }
          return normalized;
        } catch (error) { console.warn('数据读取失败，已恢复示例数据', error); return defaultState(); }
      }

      let state = loadState();
      let activeView = navItems.some(n => n.id === state.settings.activeView) ? state.settings.activeView : 'ideas';
      let activeMetricStages = {};
      let draftSearchQuery = '';
      let saveTimer = null;
      let pendingConfirmAction = null;
      let activeIdeaFormDraft = null;
      const extensionModules = new Map();
      const subscribers = new Set();

      function saveState(immediate=false) {
        clearTimeout(saveTimer);
        const write = () => {
          state.meta.updatedAt = nowISO();
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
          catch (error) { toast('保存失败','浏览器本地存储空间不足，请删除部分图片','error');return; }
          const label = document.getElementById('saveLabel');
          if (label) label.textContent = `已保存 · ${formatDate(state.meta.updatedAt, true)}`;
          subscribers.forEach(fn => { try { fn(clone(state)); } catch (e) { console.error(e); } });
        };
        if (immediate) write(); else saveTimer = setTimeout(write, 220);
      }

      function getSection(id) { return stateItems('sections').find(s => s?.id === id) || { name:'未分板块', icon:'📁', color:'#6b7280' }; }
      function renderSectionOptions(selectedId='') {
        const sections = stateItems('sections');
        if (!sections.length) return '<option value="" selected disabled>请先在设置中添加板块</option>';
        const activeId = sections.some(section=>section?.id===selectedId) ? selectedId : sections[0]?.id;
        return sections.map(section=>`<option value="${escAttr(section?.id||'')}" ${section?.id===activeId?'selected':''}>${esc(section?.icon||'📁')} ${esc(section?.name||'未命名板块')}</option>`).join('');
      }
      function ideaScore(idea) { return Object.values(idea?.scores || {}).reduce((sum,n) => sum + Number(n || 0), 0); }
      function latestMetrics(pub) {
        for (const stage of ['30d','7d','24h']) if (Number(pub?.metrics?.[stage]?.views || 0) > 0) return { stage, ...blankMetrics(), ...pub.metrics[stage] };
        return { stage:'24h', ...blankMetrics(), ...(pub?.metrics?.['24h'] || {}) };
      }
      function engagement(metrics) {
        const views = Number(metrics?.views || 0);
        return views ? ((Number(metrics?.likes||0)+Number(metrics?.saves||0)+Number(metrics?.comments||0)+Number(metrics?.shares||0))/views*100) : 0;
      }
      function statusBadge(status) {
        const map = { pending:['待评估','badge-gray'], candidate:['备选','badge-yellow'], adopted:['采用','badge-green'], rejected:['淘汰','badge-red'] };
        const [name,cls] = map[status] || map.pending;
        return `<span class="badge ${cls}">${name}</span>`;
      }
      function markBadge(mark) {
        const map = { normal:['观察中','badge-gray'], hit:['爆款','badge-green'], flop:['扑街','badge-red'] };
        const [name,cls] = map[mark] || map.normal;
        return `<span class="badge ${cls}">${name}</span>`;
      }

      function toast(title, detail='', type='success') {
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.innerHTML = `<i class="toast-dot"></i><div><strong>${esc(title)}</strong>${detail ? `<span>${esc(detail)}</span>` : ''}</div>`;
        document.getElementById('toastStack').appendChild(el);
        setTimeout(() => { el.style.opacity='0'; el.style.transform='translateX(12px)'; setTimeout(()=>el.remove(),200); }, 2800);
      }

      function renderNav() {
        const ideas = stateItems('ideas');
        const sections = stateItems('sections');
        const counts = { ideas:ideas.length, drafts:stateItems('drafts').length, published:stateItems('published').length, principles:stateItems('principles').filter(p=>p.enabled).length };
        const nav = document.getElementById('nav');
        const sectionNav = document.getElementById('sectionNav');
        if (!nav || !sectionNav) return;
        nav.innerHTML = navItems.map(item => `<button class="nav-item ${item.id===activeView?'active':''}" data-view="${item.id}"><span class="nav-icon">${item.icon}</span><span class="nav-name">${item.name}</span>${counts[item.id] !== undefined ? `<span class="nav-count">${counts[item.id]}</span>` : ''}</button>`).join('');
        const sectionFilter = state?.settings?.sectionFilter || 'all';
        const sectionCounts = ideas.reduce((result,idea) => { result[idea.sectionId]=(result[idea.sectionId]||0)+1;return result; },{});
        sectionNav.innerHTML = `
          <button class="nav-item ${activeView==='ideas'&&sectionFilter==='all'?'active':''}" data-section-nav="all"><span class="nav-icon">◫</span><span class="nav-name">全部板块</span><span class="nav-count">${ideas.length}</span></button>
          ${sections.map(section=>`<button class="nav-item ${activeView==='ideas'&&sectionFilter===section.id?'active':''}" data-section-nav="${escAttr(section.id)}"><span class="nav-icon">${esc(section.icon)}</span><span class="nav-name">${esc(section.name)}</span><span class="nav-count">${sectionCounts[section.id]||0}</span></button>`).join('')}`;
      }

      function topButtons() {
        if (activeView === 'ideas') return `<button class="btn desktop-only" data-action="auto-idea">${icons.spark}自动采集</button><button class="btn btn-primary" data-action="add-idea">${icons.plus}添加创意</button>`;
        if (activeView === 'drafts') return `<button class="btn" data-view="ideas">${icons.arrow}去采用创意</button><button class="btn btn-primary" data-action="add-draft">${icons.plus}新建稿件</button>`;
        if (activeView === 'published') return `<button class="btn" data-view="drafts">${icons.edit}继续写稿</button>`;
        if (activeView === 'analytics') return `<button class="btn" data-action="export-csv">${icons.download}导出复盘表</button>`;
        if (activeView === 'principles') return `<button class="btn" data-action="reset-principles">恢复默认20条</button>`;
        if (activeView === 'settings') return `<button class="btn btn-primary" data-action="export-json">${icons.download}导出数据</button>`;
        return '';
      }

      function render() {
        if (!state || typeof state !== 'object') state = defaultState();
        state.settings = state.settings && typeof state.settings === 'object' ? state.settings : { activeView:'ideas', ideaFilter:'all', sectionFilter:'all' };
        const item = navItems.find(n => n.id === activeView) || navItems[0];
        const pageTitle = document.getElementById('pageTitle');
        const pageKicker = document.getElementById('pageKicker');
        const topActions = document.getElementById('topActions');
        const content = document.getElementById('content');
        if (!pageTitle || !pageKicker || !topActions || !content) return;
        pageTitle.textContent = item.name;
        pageKicker.textContent = item.kicker;
        topActions.innerHTML = topButtons();
        renderNav();
        const renderers = { ideas:renderIdeas, drafts:renderDrafts, published:renderPublished, analytics:renderAnalytics, principles:renderPrinciples, settings:renderSettings };
        const renderer = renderers[activeView] || renderIdeas;
        content.innerHTML = renderer();
        document.title = `${item.name} · 火花台`;
      }

      function navigate(view) {
        if (!navItems.some(n => n.id === view)) return;
        activeView = view;
        if (view === 'ideas') state.settings.sectionFilter = 'all';
        state.settings.activeView = view;
        saveState();
        document.getElementById('sidebar').classList.remove('open');
        render();
        window.scrollTo({top:0,behavior:'smooth'});
      }

      function renderIdeas() {
        const ideas = stateItems('ideas');
        const sections = stateItems('sections');
        const filter = state?.settings?.ideaFilter || 'all';
        const sectionFilter = sections.some(s=>s.id===state?.settings?.sectionFilter) ? state.settings.sectionFilter : 'all';
        const filtered = ideas.filter(idea => (filter === 'all' || idea.status === filter) && (sectionFilter === 'all' || idea.sectionId === sectionFilter));
        const selectedSection = sectionFilter === 'all' ? null : getSection(sectionFilter);

      function renderDrafts() {

      function aiCheck(text) {
        const issues = [];
        const body = String(text || '');
        const emojiCount = (body.match(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu) || []).length;
        if (countChars(body) > 200) issues.push(`正文${countChars(body)}字，超过200字`);
        if (emojiCount > 2) issues.push(`检测到${emojiCount}个emoji，建议最多2个`);
        if (/首先[，,\s\S]{0,80}(其次|然后)[，,\s\S]{0,100}(最后|总之)/.test(body)) issues.push('出现“首先/其次/最后”式排比');
        if (/(让我们|我们应该|你一定要|务必要|必须要|值得注意的是|不难发现)/.test(body)) issues.push('有说教或模板化语气');
        if ((body.match(/不是.{0,20}而是/g) || []).length >= 2) issues.push('“不是…而是…”句式重复');
        if (/(小红书|抖音|微信公众号|B站|知乎|微博)/i.test(body)) issues.push('出现具体平台名');
        if ((body.match(/[！!]/g) || []).length > 3) issues.push('感叹号偏多，语气可能用力过猛');
        return issues;
      }

      function renderAiResult(draft) {
        const item = draft && typeof draft === 'object' ? draft : {};
        const issues = aiCheck(item.body);
        return issues.length
          ? `<div class="ai-result warn"><div class="ai-result-head"><span>⚠</span>发现 ${issues.length} 处可疑AI味</div><ul>${issues.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`
          : `<div class="ai-result clean"><div class="ai-result-head"><span>✓</span>没闻到明显AI味</div><p>句式、语气和emoji数量都比较克制。</p></div>`;
      }

      function safeImageSrc(value) {
        const source = String(value || '');
        return /^data:image\/[a-z0-9.+-]+;base64,/i.test(source) ? source : '';
      }

      function imageDataBytes(dataUrl) {
        return String(dataUrl || '').length;
      }

      function draftImageBytes(draft, coverImage=draft?.coverImage, images=draft?.images) {
        return imageDataBytes(coverImage) + (Array.isArray(images) ? images.reduce((sum,image)=>sum+imageDataBytes(image),0) : 0);
      }

      function storedImageBytes() {
        return [...stateItems('drafts'),...stateItems('published')].reduce((sum,item)=>sum+draftImageBytes(item),0);
      }

      function imageBytesAfterDraftChange(draft,coverImage,images) {
        return storedImageBytes()-draftImageBytes(draft)+draftImageBytes(draft,coverImage,images);
      }

      function prepareImage(file) {
        return new Promise((resolve,reject) => {
          if (!file || !String(file.type || '').startsWith('image/')) { reject(new Error('请选择图片文件')); return; }
          const reader = new FileReader();
          reader.onerror = () => reject(new Error('图片读取失败'));
          reader.onload = () => {
            const original = String(reader.result || '');
            if (file.size < DIRECT_IMAGE_LIMIT) { resolve(original); return; }
            const image = new Image();
            image.onerror = () => reject(new Error('图片格式无法读取'));
            image.onload = () => {
              try {
                const scale = Math.min(1, 1080 / image.width);
                const canvas = document.createElement('canvas');
                canvas.width = Math.max(1, Math.round(image.width * scale));
                canvas.height = Math.max(1, Math.round(image.height * scale));
                const context = canvas.getContext('2d');
                context.drawImage(image, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL('image/jpeg', 0.85));
              } catch (error) { reject(new Error('图片压缩失败')); }
            };
            image.src = original;
          };
          reader.readAsDataURL(file);
        });
      }

      async function setDraftCoverImage(id,file) {
        const draft = state.drafts.find(d=>d.id===id); if (!draft) return;
        try {
          const imageData = await prepareImage(file);
          if (imageBytesAfterDraftChange(draft,imageData,draft.images) > STORAGE_IMAGE_LIMIT) {
            toast('图片总大小超过 3MB','请换一张更小的图片','warn'); return;
          }
          draft.coverImage=imageData;draft.updatedAt=nowISO();saveState(true);render();toast('封面图已添加',file.size<DIRECT_IMAGE_LIMIT?'原图小于 500KB，已直接保存':'已压缩至最大宽度 1080px');
        } catch (error) { toast('封面图添加失败',error.message||'请换一张图片','error'); }
      }

      async function addDraftImages(id,fileList) {
        const draft = state.drafts.find(d=>d.id===id); if (!draft) return;
        const existing = Array.isArray(draft.images) ? draft.images : [];
        const available = MAX_BODY_IMAGES - existing.length;
        if (available <= 0) { toast('最多添加 9 张配图','','warn'); return; }
        const imageFiles = Array.from(fileList || []).filter(file=>String(file.type||'').startsWith('image/'));
        if (!imageFiles.length) { toast('请选择图片文件','','warn'); return; }
        const selected = imageFiles.slice(0,available);
        const nextImages = [...existing];
        let skippedForSize = false;
        try {
          for (const file of selected) {
            const imageData = await prepareImage(file);
            if (imageBytesAfterDraftChange(draft,draft.coverImage,[...nextImages,imageData]) > STORAGE_IMAGE_LIMIT) { skippedForSize=true; break; }
            nextImages.push(imageData);
          }
          const added = nextImages.length-existing.length;
          if (added) { draft.images=nextImages;draft.updatedAt=nowISO();saveState(true);render();toast(`已添加 ${added} 张配图`,`${nextImages.length} / ${MAX_BODY_IMAGES} 张`); }
          if (imageFiles.length>available) toast('最多添加 9 张配图',`本次只处理了前 ${available} 张`,'warn');
          if (skippedForSize) toast('图片总大小已达 3MB','超出部分未添加','warn');
        } catch (error) { toast('配图添加失败',error.message||'请换一张图片','error'); }
      }

      function previewTags(draft) {
        const item = draft && typeof draft === 'object' ? draft : {};
        const matched = `${item.title || ''} ${item.body || ''}`.match(/#[\p{L}\p{N}_-]+/gu) || [];
        const tags = [...new Set(matched)].slice(0,5);
        if (tags.length) return tags;
        const fallback = [`#${getSection(item.sectionId).name}`];
        if (item.coverType && item.coverType!=='其他') fallback.push(`#${item.coverType}`);
        return fallback;
      }

      function renderDraftMedia(draft) {
        const item = draft && typeof draft === 'object' ? draft : {};

        const images = Array.isArray(item.images) ? item.images.map(safeImageSrc).filter(Boolean) : [];
        return `<div class="media-editor">
          <div class="media-section"><div class="media-section-head"><label class="field-label">封面图</label><span class="media-help">支持点击或拖拽上传</span></div>
            <div class="cover-upload ${cover?'has-image':''}" data-action="select-cover-image" data-id="${escAttr(item.id||'')}" data-cover-dropzone="${escAttr(item.id||'')}" role="button" tabindex="0" aria-label="${cover?'更换封面图':'点击添加封面'}">
              ${cover?`<img src="${escAttr(cover)}" alt="封面图预览"><button class="image-remove" type="button" data-action="remove-cover-image" data-id="${escAttr(item.id||'')}" title="删除封面图" aria-label="删除封面图">×</button>`:`<span class="cover-placeholder"><span class="camera">📷</span><strong>点击添加封面</strong></span>`}
            </div>
            <input class="hidden" type="file" accept="image/*" data-cover-image-input data-id="${escAttr(item.id||'')}">
          </div>
          <div class="media-section"><div class="media-section-head"><label class="field-label">正文配图</label><span class="media-help">1–9 张 · 本机图片共不超过 3MB</span></div>
            ${images.length?`<div class="inline-images">${images.map((image,index)=>`<div class="inline-image"><img src="${escAttr(image)}" alt="正文配图 ${index+1}"><button class="image-remove" type="button" data-action="remove-body-image" data-id="${escAttr(item.id||'')}" data-index="${index}" title="删除配图" aria-label="删除第 ${index+1} 张配图">×</button></div>`).join('')}</div>`:''}
            <input class="hidden" type="file" accept="image/*" multiple data-body-images-input data-id="${escAttr(item.id||'')}">
            <button class="btn btn-sm add-images-btn" type="button" data-action="select-body-images" data-id="${escAttr(item.id||'')}" ${images.length>=MAX_BODY_IMAGES?'disabled':''}>${icons.plus}添加配图</button><span class="image-limit">${images.length} / ${MAX_BODY_IMAGES}</span>
          </div>
        </div>`;
      }

      function renderDraftCard(draft) {
        const item = draft && typeof draft === 'object' ? draft : {};
        const checklist = CHECKLIST_LABELS.map((_,index)=>Boolean(item.checklist?.[index]));
        const count = countChars(item.body||'');
        const checked = checklist.filter(Boolean).length;
        return `<article class="card draft-card" data-draft-card="${escAttr(item.id||'')}">
          <div class="editor-pane">
            <div class="editor-head"><div class="eyebrow">自动保存 · 更新于 ${formatDate(item.updatedAt,true)}</div><button class="btn btn-sm btn-ghost" data-action="delete-draft" data-id="${escAttr(item.id||'')}">${icons.trash}删除</button></div>

            <div class="cover-row"><input class="input" data-draft-field="coverIdea" data-id="${escAttr(item.id||'')}" value="${escAttr(item.coverIdea||'')}" placeholder="例如：停车场里拿红笔圈出一辆车"><select class="select" data-draft-field="coverType" data-id="${escAttr(item.id||'')}">${coverOptions(item.coverType||'其他')}</select></div>
            ${renderDraftMedia(item)}

          <aside class="review-pane">

            <div class="checklist">${CHECKLIST_LABELS.map((label,i)=>`<label class="check-item"><input type="checkbox" data-check-index="${i}" data-id="${escAttr(item.id||'')}" ${checklist[i]?'checked':''}><span>${label}</span></label>`).join('')}</div>
            <div class="progress"><div class="progress-bar" id="progress-${escAttr(item.id||'')}" style="width:${checked/6*100}%"></div></div>

          </aside>
        </article>`;
      }

      function coverOptions(current) {
        return ['人物+车','场景实拍','产品特写','前后对比','手绘/AI图','纯文字','其他'].map(v=>`<option value="${v}" ${v===current?'selected':''}>${v}</option>`).join('');
      }

      function renderPublished() {
        const published = stateItems('published');
        const totalViews = published.reduce((sum,p)=>sum+Number(latestMetrics(p).views||0),0);
        const totalLikes = published.reduce((sum,p)=>sum+Number(latestMetrics(p).likes||0),0);
        const hits = published.filter(p=>p?.mark==='hit').length;
        const avgEng = published.length ? published.reduce((sum,p)=>sum+engagement(latestMetrics(p)),0)/published.length : 0;
        return `
          <div class="stats">
            ${statCard('累计发布',published.length,'全部发布记录',icons.published)}
            ${statCard('累计浏览',formatNum(totalViews),'按最新阶段数据',icons.analytics)}
            ${statCard('累计点赞',formatNum(totalLikes),'按最新阶段数据',icons.spark)}
            ${statCard('平均互动率',avgEng.toFixed(1)+'%','赞藏评享 / 浏览',icons.principles)}
          </div>
          <div class="section-head"><div><h2>发布记录</h2><p>点击卡片查看全文与复盘；切换24h、7d、30d可直接录入反馈。</p></div><div class="filters"><span class="badge badge-green">爆款 ${hits}</span><span class="badge badge-red">扑街 ${published.filter(p=>p?.mark==='flop').length}</span></div></div>
          <div class="published-grid">${published.length ? published.map(renderPublishedCard).join('') : emptyState('还没有发布记录','稿件完成检查后，点击“发布并归档”。')}</div>
        `;

      function renderPublishedCard(pub) {

          <div class="published-main"><div class="published-summary">${cover?`<button class="published-cover-button" type="button" data-action="view-published-cover" data-id="${escAttr(item.id||'')}" title="放大查看封面"><img src="${escAttr(cover)}" alt="${escAttr(item.title||'稿件')}封面"></button>`:''}<div class="published-copy"><div class="card-top"><div class="eyebrow"><span class="badge" style="color:${escAttr(sec?.color||'#6b7280')};background:${escAttr(sec?.color||'#6b7280')}18;border-color:${escAttr(sec?.color||'#6b7280')}35">${esc(sec?.name||'未分板块')}</span>${esc(item.platform||'小红书')} · 发布于 ${formatDate(item.publishedAt,true)}</div>${markBadge(item.mark)}</div>

          <div class="metrics">${[['views','浏览'],['likes','赞'],['saves','藏'],['comments','评'],['shares','分享']].map(([key,label])=>`<div class="metric"><label>${label}</label><input class="metric-input" type="number" min="0" value="${Number(metrics?.[key]||0)}" data-metric-field="${key}" data-stage="${stage}" data-id="${escAttr(item.id||'')}"></div>`).join('')}</div></div>
          <div class="published-foot"><span class="word-count">互动率 ${engagement(metrics).toFixed(1)}%</span><span class="word-count">· ${esc(item.coverType||'其他')}</span><button type="button" class="btn btn-sm" data-action="view-published-detail" data-id="${escAttr(item.id||'')}">查看详情</button><select class="select mark-select" data-published-mark data-id="${escAttr(item.id||'')}"><option value="normal" ${item.mark==='normal'?'selected':''}>正常</option><option value="hit" ${item.mark==='hit'?'selected':''}>爆款</option><option value="flop" ${item.mark==='flop'?'selected':''}>扑街</option></select><button type="button" class="btn btn-sm icon-btn btn-ghost" data-action="delete-published" data-id="${escAttr(item.id||'')}" title="删除">${icons.trash}</button></div>

      function showPublishedDetail(id) {

          <div class="modal-head"><h3 id="publishedDetailTitle">已发稿件详情</h3><button type="button" class="btn icon-btn btn-ghost" data-close-modal aria-label="关闭">${icons.close}</button></div>

          <div class="modal-foot"><button type="button" class="btn btn-primary" data-close-modal>关闭</button></div>
        </div></div>`;

      function renderAnalytics() {
        const published = stateItems('published');
        const data = published.map(p => ({ p, m:latestMetrics(p) }));
        const maxViews = Math.max(1,...data.map(x=>Number(x.m.views||0)));
        const avgTitle = data.length ? data.reduce((s,x)=>s+countChars(x.p.title),0)/data.length : 0;
        const hookCount = data.filter(x=>/(别|先|为什么|怎么|到底|真相|答案|避坑)/.test(x.p.title)).length;
        const numericCount = data.filter(x=>/\d/.test(x.p.title)).length;
        const coverGroups = groupStats(data, x=>x.p.coverType || '其他');
        const timeGroups = groupStats(data, x=>timeBucket(x.p.publishedAt));
        const suggestions = buildSuggestions(data, hookCount, numericCount, coverGroups, timeGroups);
        return `
          <div class="stats">
            ${statCard('分析样本',data.length,'已发布内容数量',icons.analytics)}
            ${statCard('标题均长',avgTitle.toFixed(1)+'字','建议短而有方向',icons.edit)}
            ${statCard('钩子标题',hookCount,'含别/先/为什么等',icons.spark)}
            ${statCard('爆款率',data.length?Math.round(published.filter(p=>p.mark==='hit').length/data.length*100)+'%':'0%','手动标记口径',icons.published)}
          </div>
          <div class="analytics-grid">
            <section class="card analytics-card"><h3>标题规律</h3><p>从标题长度、方向性钩子和数字使用中找规律</p><div class="insight-list">
              <div class="insight"><i class="insight-icon">钩</i><div><strong>${hookCount}/${data.length || 0} 篇使用方向性钩子</strong><p>${hookCount ? '“先/别/为什么”能快速交代阅读方向。' : '可以尝试用“先/别/为什么”明确读者下一步。'}</p></div></div>
              <div class="insight"><i class="insight-icon">字</i><div><strong>平均 ${avgTitle.toFixed(1)} 字</strong><p>保持标题短促，删除不能改变方向的形容词。</p></div></div>
              <div class="insight"><i class="insight-icon">数</i><div><strong>${numericCount} 篇标题含数字</strong><p>数字可能必要，但别让它代替观点。</p></div></div>
            </div></section>
            <section class="card analytics-card"><h3>内容浏览对比</h3><p>按各稿件最新已录入阶段展示</p><div class="mini-bars">${data.length ? data.sort((a,b)=>b.m.views-a.m.views).slice(0,6).map(x=>`<div class="bar-row"><span class="bar-label" title="${escAttr(x.p.title)}">${esc(x.p.title)}</span><div class="bar-track"><div class="bar-fill" style="width:${Number(x.m.views||0)/maxViews*100}%"></div></div><span class="bar-value">${formatNum(x.m.views)}</span></div>`).join('') : '<p class="word-count">发布内容后生成对比图。</p>'}</div></section>
            <section class="card analytics-card"><h3>封面效果</h3><p>按封面类型聚合平均浏览与互动率</p><div class="insight-list">${coverGroups.length ? coverGroups.map(g=>`<div class="insight"><i class="insight-icon">封</i><div><strong>${esc(g.name)} · 平均 ${formatNum(g.avgViews)} 浏览</strong><p>${g.count} 篇样本，平均互动率 ${g.avgEng.toFixed(1)}%</p></div></div>`).join('') : '<p class="word-count">暂无封面样本。</p>'}</div></section>
            <section class="card analytics-card"><h3>发布时机</h3><p>按发布时间段聚合，不把偶然当规律</p><div class="insight-list">${timeGroups.length ? timeGroups.map(g=>`<div class="insight"><i class="insight-icon">时</i><div><strong>${esc(g.name)} · 平均 ${formatNum(g.avgViews)} 浏览</strong><p>${g.count} 篇样本，平均互动率 ${g.avgEng.toFixed(1)}%</p></div></div>`).join('') : '<p class="word-count">暂无发布时间样本。</p>'}</div></section>
          </div>
          <section class="card analytics-card" style="margin-bottom:15px"><h3>AI复盘建议</h3><p>基于当前本地样本的规则推断；样本越多，建议越有参考价值。</p><div class="insight-list">${suggestions.map((s,i)=>`<div class="insight"><i class="insight-icon">${i+1}</i><div><strong>${esc(s.title)}</strong><p>${esc(s.detail)}</p></div></div>`).join('')}</div></section>
          <section class="card table-card"><div class="table-head"><h3>内容效果对比表</h3><p>浏览取最新已录入阶段，互动率=（赞+藏+评+分享）/浏览</p></div><div class="table-wrap"><table><thead><tr><th>标题</th><th>板块</th><th>阶段</th><th>浏览</th><th>赞</th><th>藏</th><th>评</th><th>分享</th><th>互动率</th><th>标记</th></tr></thead><tbody>${data.length ? data.map(({p,m})=>`<tr><td>${esc(p.title)}</td><td>${esc(getSection(p.sectionId).name)}</td><td>${m.stage}</td><td>${formatNum(m.views)}</td><td>${formatNum(m.likes)}</td><td>${formatNum(m.saves)}</td><td>${formatNum(m.comments)}</td><td>${formatNum(m.shares)}</td><td>${engagement(m).toFixed(1)}%</td><td>${markBadge(p.mark)}</td></tr>`).join('') : '<tr><td colspan="10" style="text-align:center;color:var(--muted)">暂无数据</td></tr>'}</tbody></table></div></section>
        `;
      }

      function timeBucket(value) {
        const hour = new Date(value).getHours();
        if (hour < 6) return '深夜 0–6';
        if (hour < 11) return '上午 6–11';
        if (hour < 14) return '午间 11–14';
        if (hour < 18) return '下午 14–18';
        return '晚间 18–24';
      }

      function groupStats(data, keyFn) {
        if (!Array.isArray(data) || typeof keyFn !== 'function') return [];
        const groups = {};
        data.forEach(item => { const key=keyFn(item); (groups[key] ||= []).push(item); });
        return Object.entries(groups).map(([name,items]) => ({ name, count:items.length, avgViews:Math.round(items.reduce((s,x)=>s+Number(x.m.views||0),0)/items.length), avgEng:items.reduce((s,x)=>s+engagement(x.m),0)/items.length })).sort((a,b)=>b.avgViews-a.avgViews);
      }

      function buildSuggestions(data, hookCount, numericCount, covers, times) {
        data = Array.isArray(data) ? data : [];
        covers = Array.isArray(covers) ? covers : [];
        times = Array.isArray(times) ? times : [];
        if (!data.length) return [{title:'先积累最小样本',detail:'发布3篇内容并补齐24h数据后，再比较标题、封面与发布时间。'}];
        const list = [];
        const top = [...data].sort((a,b)=>b.m.views-a.m.views)[0];
        list.push({title:`继续拆解「${top.p.title}」`,detail:`当前样本中浏览最高（${formatNum(top.m.views)}），复用它的选题方向，不要照搬句式。`});
        if (data.length < 5) list.push({title:'先别急着下结论',detail:`当前只有${data.length}篇样本。至少积累5篇并补齐7d数据，再判断发布时间和封面规律。`});
        if (hookCount/data.length < .6) list.push({title:'加强标题方向性',detail:'下一轮可多测试“先/别/为什么”类钩子，让读者一眼知道文章要帮他做什么。'});
        if (numericCount/data.length > .5) list.push({title:'减少数字依赖',detail:'数字可以交代预算，但方向性观点应该站在标题中央。'});
        if (covers[0]) list.push({title:`优先复测「${covers[0].name}」封面`,detail:`这一类型当前平均浏览${formatNum(covers[0].avgViews)}，再做2–3篇同类型验证是否稳定。`});
        if (times[0]) list.push({title:`保留「${times[0].name}」时段`,detail:`当前该时段平均浏览${formatNum(times[0].avgViews)}。保持选题强度接近，做同条件对照。`});
        return list.slice(0,4);
      }

      function renderPrinciples() {
        const principles = stateItems('principles');
        const enabled = principles.filter(p=>p.enabled).length;
        const progress = principles.length ? enabled/principles.length*100 : 0;
        return `
          <section class="hero" style="grid-template-columns:1fr minmax(250px,.55fr)"><div><h2>原则不是墙上的字，<span class="hero-accent">是发布前的刹车</span></h2><p>点击文字即可改，开关用于临时停用。所有修改都会自动保存在当前浏览器。</p></div><div class="principle-progress"><div class="progress"><div class="progress-bar" style="width:${progress}%"></div></div><strong>${enabled}/${principles.length} 启用</strong></div></section>

          <div class="principles">${principles.length?principles.map((p,i)=>`<div class="principle-item"><div class="principle-num">${String(i+1).padStart(2,'0')}</div><input class="principle-input" data-principle-text data-id="${escAttr(p.id||'')}" value="${escAttr(p.text||'')}"><input class="principle-toggle" type="checkbox" data-principle-toggle data-id="${escAttr(p.id||'')}" ${p.enabled?'checked':''} title="启用/停用"></div>`).join(''):emptyState('暂无运营原则','可点击右上角恢复默认20条。')}</div>

        return `

      function showIdeaModal(id=null, mode='manual') {
        const ideas = stateItems('ideas');
        const sections = stateItems('sections');
        const idea = id ? ideas.find(i=>i?.id===id) : null;
        if (id && !idea) { toast('未找到这条创意','可能已被删除或数据已更新','warn'); return; }
        const autoSeeds = [
          {title:'为什么AI生成的车图一眼就假？',source:'热点雷达 · AI绘图',note:'从轮胎、车标、反光三个破绽切入。'},
          {title:'第一次用AI写文案，先删掉这句话',source:'关键词监测 · AI文案',note:'围绕模板化开头做散装改写。'},
          {title:'预算不涨，怎么把选车范围砍到三台？',source:'销量榜波动',note:'用销量、保有量和场景做三步筛选。'}
        ];
        const seed = autoSeeds[Math.floor(Math.random()*autoSeeds.length)];
        const defaults = { title:mode==='auto'?seed.title:'', sourceMode:mode, source:mode==='auto'?seed.source:'手动记录', sectionId:sections[0]?.id||'', scores:{intensity:mode==='auto'?3:0,whitespace:mode==='auto'?3:0,persona:mode==='auto'?4:0,timeliness:mode==='auto'?4:0}, status:'pending', note:mode==='auto'?seed.note:'' };
        const data = { ...defaults, ...(idea||{}), scores:{...defaults.scores,...(idea?.scores||{})} };
        activeIdeaFormDraft = clone(data);
        document.getElementById('modalRoot').innerHTML = `<div class="modal-backdrop" data-modal-backdrop><div class="modal" role="dialog" aria-modal="true" aria-labelledby="ideaModalTitle"><form id="ideaForm" data-edit-id="${escAttr(idea?.id||'')}">
          <div class="modal-head"><h3 id="ideaModalTitle">${idea?'编辑创意':mode==='auto'?'自动采集结果':'添加创意'}</h3><button type="button" class="btn icon-btn btn-ghost" data-close-modal aria-label="关闭">${icons.close}</button></div>
          <div class="modal-body"><div class="form-grid">
            <div class="field full"><label>录入方式</label><div class="mode-switch"><button type="button" class="mode-option ${data.sourceMode==='manual'?'active':''}" data-source-mode="manual">手动添加</button><button type="button" class="mode-option ${data.sourceMode==='auto'?'active':''}" data-source-mode="auto">自动采集</button></div><input type="hidden" name="sourceMode" value="${escAttr(data.sourceMode||'manual')}"></div>
            <div class="field full"><label>创意标题 *</label><input class="input" name="title" value="${escAttr(data.title||'')}" placeholder="一句话说清选题方向" required autofocus></div>
            <div class="field"><label>来源</label><input class="input" name="source" value="${escAttr(data.source||'')}" placeholder="热榜、评论、灵感……"></div>
